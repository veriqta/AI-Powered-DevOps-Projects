version: 1
name: ai-action-policy
default: deny
rules:
  - action: explain
    decision: allow
    conditions:
      evidence_references_required: true
  - action: recommend
    decision: allow
    conditions:
      human_review_required: true
  - action: deploy
    decision: deny
  - action: delete_resource
    decision: deny
  - action: modify_access
    decision: deny

